<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Elite Motors</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="ltr admin-body">
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <div class="admin-logo">◆ Elite Motors</div>
      <h2>Admin Login</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" class="admin-login-form">
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required autofocus placeholder="Enter admin password" />
        </div>
        <button type="submit" class="btn btn-gold btn-block">Login</button>
      </form>

      <a href="{{ url_for('index') }}" class="back-link">← Back to site</a>
    </div>
  </div>
</body>
</html>
